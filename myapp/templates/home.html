{% block javascript %}

<!-- 先加载 hls.js，必须放在你自己的 JavaScript 前面 -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>

    $(function () {

        const video =
            document.getElementById(
                "videoPlayer"
            );


        /* =====================================
           HLS Live Stream
           ===================================== */

        const streamUrl = "/hls/cam1.m3u8";

        let hls = null;


        if (Hls.isSupported()) {

            console.log(
                "HLS.js supported"
            );

            console.log(
                "Loading stream:",
                streamUrl
            );


            hls = new Hls({

                // 尽量靠近直播边缘
                liveSyncDurationCount: 2,

                // 最大允许延迟
                liveMaxLatencyDurationCount: 5

            });


            // 加载 m3u8
            hls.loadSource(
                streamUrl
            );


            // 绑定到 video
            hls.attachMedia(
                video
            );


            // HLS manifest 加载成功
            hls.on(
                Hls.Events.MANIFEST_PARSED,
                function () {

                    console.log(
                        "HLS manifest loaded"
                    );


                    video.play().catch(
                        function (err) {

                            console.log(
                                "Autoplay blocked:",
                                err
                            );

                        }
                    );

                }
            );


            // HLS 错误处理
            hls.on(
                Hls.Events.ERROR,
                function (event, data) {

                    console.error(
                        "HLS error:",
                        data
                    );


                    if (data.fatal) {

                        switch (
                            data.type
                        ) {

                            case Hls.ErrorTypes.NETWORK_ERROR:

                                console.log(
                                    "HLS network error, retrying..."
                                );

                                hls.startLoad();

                                break;


                            case Hls.ErrorTypes.MEDIA_ERROR:

                                console.log(
                                    "HLS media error, recovering..."
                                );

                                hls.recoverMediaError();

                                break;


                            default:

                                console.log(
                                    "Fatal HLS error"
                                );

                                hls.destroy();

                                break;

                        }

                    }

                }
            );

        }

        else if (
            video.canPlayType(
                "application/vnd.apple.mpegurl"
            )
        ) {

            /*
             * Safari 等浏览器原生支持 HLS
             */

            console.log(
                "Native HLS supported"
            );


            video.src =
                streamUrl;


            video.addEventListener(
                "loadedmetadata",
                function () {

                    video.play().catch(
                        function (err) {

                            console.log(
                                "Autoplay blocked:",
                                err
                            );

                        }
                    );

                }
            );

        }

        else {

            console.error(
                "This browser does not support HLS"
            );

        }



        /* =====================================
           Current Time
           ===================================== */

        function updateTime() {

            const now =
                new Date();


            const year =
                now.getFullYear();


            const month =
                String(
                    now.getMonth() + 1
                ).padStart(
                    2,
                    "0"
                );


            const day =
                String(
                    now.getDate()
                ).padStart(
                    2,
                    "0"
                );


            const hour =
                String(
                    now.getHours()
                ).padStart(
                    2,
                    "0"
                );


            const minute =
                String(
                    now.getMinutes()
                ).padStart(
                    2,
                    "0"
                );


            const second =
                String(
                    now.getSeconds()
                ).padStart(
                    2,
                    "0"
                );


            $("#currentTime").text(

                year + "-" +
                month + "-" +
                day + " " +
                hour + ":" +
                minute + ":" +
                second

            );

        }


        updateTime();


        setInterval(
            updateTime,
            1000
        );



        /* =====================================
           Player Buttons
           ===================================== */


        $("#playBtn").click(
            function () {

                video.play().catch(
                    function (err) {

                        console.log(
                            "Play failed:",
                            err
                        );

                    }
                );

            }
        );



        $("#pauseBtn").click(
            function () {

                video.pause();

            }
        );



        $("#muteBtn").click(
            function () {

                video.muted =
                    !video.muted;


                if (
                    video.muted
                ) {

                    $(this).text(
                        "Unmute"
                    );

                }

                else {

                    $(this).text(
                        "Mute"
                    );

                }

            }
        );



        $("#refreshBtn").click(
            function () {

                console.log(
                    "Refreshing HLS stream"
                );


                if (
                    hls
                ) {

                    /*
                     * 停止旧流
                     */

                    hls.stopLoad();


                    /*
                     * 重新加载 m3u8
                     */

                    hls.loadSource(
                        streamUrl
                    );


                    hls.startLoad();


                }

                else {

                    /*
                     * Safari 原生 HLS
                     */

                    video.load();

                }


                video.play().catch(
                    function (err) {

                        console.log(
                            "Refresh play failed:",
                            err
                        );

                    }
                );

            }
        );



        $("#fullscreenBtn").click(
            function () {

                if (
                    video.requestFullscreen
                ) {

                    video.requestFullscreen();

                }

                else if (
                    video.webkitRequestFullscreen
                ) {

                    video.webkitRequestFullscreen();

                }

            }
        );



        /* =====================================
           Device Status AJAX
           ===================================== */

        function getDeviceStatus() {


            $.ajax({

                url:
                    "/api/device/status/",


                type:
                    "GET",


                dataType:
                    "json",


                success:
                    function (data) {


                        /* CPU */

                        $("#cpuUsage")
                            .text(
                                data.cpu_usage
                            );


                        $("#cpuProgress")
                            .css(
                                "width",
                                data.cpu_usage + "%"
                            );



                        /* Temperature */

                        $("#cpuTemp")
                            .text(
                                data.cpu_temp
                            );



                        /* Memory */

                        $("#memoryUsage")
                            .text(
                                data.memory_usage
                            );


                        $("#memoryProgress")
                            .css(
                                "width",
                                data.memory_usage + "%"
                            );



                        /* Camera */

                        $("#fps")
                            .text(
                                data.fps
                            );



                        /* Network */

                        $("#networkRx")
                            .text(
                                data.network_rx
                            );


                        $("#networkTx")
                            .text(
                                data.network_tx
                            );



                        /* Device Information */

                        $("#deviceId")
                            .text(
                                data.device_id
                            );


                        $("#deviceIp")
                            .text(
                                data.ip
                            );


                        $("#uptime")
                            .text(
                                data.uptime
                            );



                        /* Online Status */

                        if (
                            data.online === true
                        ) {


                            $("#deviceStatus")
                                .text(
                                    "Online"
                                )
                                .removeClass(
                                    "offline-text"
                                )
                                .addClass(
                                    "online-text"
                                );


                            $("#deviceStatusText")
                                .text(
                                    "Device Online"
                                );


                            $("#deviceStatusDot")
                                .removeClass(
                                    "offline"
                                );

                        }

                        else {

                            setDeviceOffline();

                        }


                    },


                error:
                    function () {


                        /*
                         * Django API cannot be reached.
                         * Treat the device as offline.
                         */

                        setDeviceOffline();

                    }

            });

        }



        /* =====================================
           Offline State
           ===================================== */

        function setDeviceOffline() {


            $("#deviceStatus")
                .text(
                    "Offline"
                )
                .removeClass(
                    "online-text"
                )
                .addClass(
                    "offline-text"
                );


            $("#deviceStatusText")
                .text(
                    "Device Offline"
                );


            $("#deviceStatusDot")
                .addClass(
                    "offline"
                );

        }



        /* =====================================
           Get status immediately
           ===================================== */

        getDeviceStatus();



        /* =====================================
           Refresh device information
           every second
           ===================================== */

        setInterval(
            getDeviceStatus,
            1000
        );


    });

</script>

{% endblock %}
```
